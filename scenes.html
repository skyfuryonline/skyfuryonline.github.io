<!DOCTYPE html>
<!-- 微缩景观集 —— 猫猫彩蛋选集页 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>微缩景观集 · DIORAMA</title>
<style>
  :root { --ink: #0c1014; --gold: #ffd166; --paper: #e8e4d8; --dim: #6b7a88; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 70% -10%, rgba(255,214,150,.10), transparent 60%),
      radial-gradient(ellipse 800px 600px at 15% 110%, rgba(110,168,138,.10), transparent 60%),
      linear-gradient(175deg, #0c1014 0%, #10161c 55%, #0d1310 100%);
    font-family: "Courier New", Courier, monospace;
    color: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 40px; padding: 40px 20px;
  }
  header { text-align: center; }
  header .cat { font-size: 34px; display: block; margin-bottom: 12px; }
  header h1 { font-size: 21px; letter-spacing: 6px; font-weight: 700; color: var(--paper); }
  header p { margin-top: 10px; font-size: 11px; letter-spacing: 3px; color: var(--dim); }
  .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
  a.card {
    display: block; width: 300px; text-decoration: none; color: var(--paper);
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px; overflow: hidden;
    background: rgba(255,255,255,.03);
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    position: relative;
  }
  a.card:hover, a.card:focus { transform: translateY(-6px); border-color: rgba(255,209,102,.55); box-shadow: 0 18px 44px rgba(0,0,0,.5); outline: none; }
  .thumb { height: 150px; position: relative; overflow: hidden; }
  .thumb.sun {
    background:
      radial-gradient(circle 46px at 76% 22%, rgba(255,236,180,.95), rgba(255,214,150,.35) 60%, transparent 70%),
      linear-gradient(190deg, #8a76c0 0%, #f8a86a 52%, #ffd898 100%);
  }
  .thumb.sun .sil { position: absolute; left: 10%; bottom: -6px; width: 80%; height: 64px;
    background: linear-gradient(180deg, transparent 0 30%, #3a3226 30%), #2a2f3a;
    clip-path: polygon(0 100%, 0 34%, 12% 34%, 12% 12%, 58% 12%, 58% 0, 100% 0, 100% 100%); }
  .thumb.sun .awn { position: absolute; left: 14%; top: 46%; width: 66%; height: 12px; background: #2f8f7d; border-radius: 3px; }
  .thumb.green {
    background:
      linear-gradient(115deg, rgba(255,220,150,.5) 0 18%, transparent 30%),
      radial-gradient(circle 70px at 50% 8%, rgba(160,220,150,.5), transparent 65%),
      linear-gradient(180deg, #6a8a9a 0%, #5a8a6a 55%, #3f6a4a 100%);
  }
  .thumb.green .trunk { position: absolute; left: 46%; bottom: 0; width: 16px; height: 92px; background: #4a3f30; border-radius: 4px 4px 0 0; }
  .thumb.green .ray { position: absolute; top: -20px; width: 34px; height: 150px; transform: rotate(14deg);
    background: linear-gradient(180deg, rgba(255,236,180,.5), rgba(255,236,180,.04)); }
  .thumb.green .ray.r2 { left: 40%; } .thumb.green .ray.r1 { left: 52%; height: 120px; }
  .thumb .meta { padding: 14px 16px 16px; }
  .thumb .jp { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
  .thumb .cn { font-size: 11px; color: var(--dim); margin-top: 5px; letter-spacing: 1px; }
  .card .enter { position: absolute; right: 14px; bottom: 12px; font-size: 10px; color: var(--gold); opacity: 0; transition: opacity .2s; }
  .card:hover .enter, .card:focus .enter { opacity: 1; }
  .hint { font-size: 10px; letter-spacing: 2px; color: #4a5866; text-align: center; }
  .hint b { color: var(--dim); }
</style>
</head>
<body>
  <header>
    <span class="cat">🐈</span>
    <h1>微缩景观集</h1>
    <p>NEKO DIORAMA COLLECTION · SELECT A WORLD</p>
  </header>
  <div class="cards">
    <a class="card" href="/afternoon/" id="c-afternoon">
      <div class="thumb sun">
        <div class="sil"></div>
        <div class="awn"></div>
      </div>
      <div class="meta">
        <div class="jp">午後のコンビニ</div>
        <div class="cn">便利店街角 · 金色时刻</div>
      </div>
      <span class="enter">ENTER ▸</span>
    </a>
    <a class="card" href="/ruins/" id="c-ruins">
      <div class="thumb green">
        <div class="ray r1"></div><div class="ray r2"></div>
        <div class="trunk"></div>
      </div>
      <div class="meta">
        <div class="jp">自然に還った街角</div>
        <div class="cn">被自然收回的街角 · 秘密基地</div>
      </div>
      <span class="enter">ENTER ▸</span>
    </a>
  </div>
  <div class="hint">← → 选择 · ENTER 进入 · 拖拽旋转 / 滚轮缩放</div>
<script>
(function () {
  var sel = 0;
  var cards = [document.getElementById('c-afternoon'), document.getElementById('c-ruins')];
  function paint() {
    cards.forEach(function (c, i) {
      c.style.borderColor = i === sel ? 'rgba(255,209,102,.75)' : 'rgba(255,255,255,.1)';
      c.style.transform = i === sel ? 'translateY(-6px)' : 'none';
      c.querySelector('.enter').style.opacity = i === sel ? 1 : 0;
    });
  }
  paint();
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { sel = 1 - sel; paint(); }
    else if (e.key === 'Enter') window.location.href = cards[sel].href;
  });
  cards.forEach(function (c, i) {
    c.addEventListener('mouseenter', function () { sel = i; paint(); });
  });
})();
</script>
</body>
</html>
