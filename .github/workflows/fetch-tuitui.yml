name: Fetch 花生十三每日图推

on:
  schedule:
    # 每天 15:00 CST 和 21:00 CST 各运行一次
    - cron: '0 7,13 * * *'
  workflow_dispatch:

concurrency:
  group: "fetch-tuitui"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master 🛎️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main

      - name: Checkout blog-source (data) 📚
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: skyfuryonline/blog-source
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source

      - name: Sync existing data into main
        run: |
          mkdir -p main/_data main/cache
          rsync -av private-source/_data/ main/_data/ 2>/dev/null || true
          rsync -av private-source/cache/ main/cache/ 2>/dev/null || true

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run tuitui crawler 🕷️
        working-directory: ./main
        run: python crawlers/fetch_tuitui.py

      - name: Run chengyu crawler 📖
        working-directory: ./main
        run: python crawlers/fetch_chengyu.py

      - name: Commit data to blog-source 💾
        run: |
          mkdir -p private-source/_data private-source/cache
          rsync -av main/_data/tuitui.json private-source/_data/tuitui.json 2>/dev/null || true
          rsync -av main/cache/tuitui/ private-source/cache/tuitui/ 2>/dev/null || true
          rsync -av main/cache/tuitui_state.json private-source/cache/tuitui_state.json 2>/dev/null || true
          rsync -av main/_data/chengyu.json private-source/_data/chengyu.json 2>/dev/null || true
          rsync -av main/cache/chengyu_state.json private-source/cache/chengyu_state.json 2>/dev/null || true
          cd private-source
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data cache
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tuitui and chengyu data"
            git push
          else
            echo "No changes."
          fi
