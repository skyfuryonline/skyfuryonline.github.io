<!DOCTYPE html>
<!--
  博客入口页版式（layout: warm）
  独立于主题 CSS / 导航 / footer。文案和句子都放在 index.html，
  每条是「正文 + 作者（另起一行）」，由脚本从句子池里随机抽取，标题固定。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} · {{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#faf6ef">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/img/favicon.svg">

<style>
:root {
    --bg:       #faf6ef;
    --bg-soft:  #f3ece0;
    --ink:      #3f352c;
    --ink-soft: #6b5d50;
    --accent:   #a9743f;
    --line:     rgba(169, 116, 63, .32);
    --stagger:  .6s;   /* 每条浮现的间隔 */
    --rise:     1.5s;  /* 单条浮现的时长 */
    --font: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
}

/* 系统偏暗时把灯调暗，仍是暖的 */
@media (prefers-color-scheme: dark) {
    :root {
        --bg:       #26211d;
        --bg-soft:  #302720;
        --ink:      #f2e7d9;
        --ink-soft: #cbb39a;
        --accent:   #d6a670;
        --line:     rgba(214, 166, 112, .28);
    }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex; flex-direction: column;
    color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(155deg, var(--bg-soft), var(--bg) 58%);
}

.masthead {
    padding: 34px clamp(24px, 7vw, 88px);
    font-size: .92rem; letter-spacing: .14em; color: var(--ink-soft);
}

.room {
    flex: 1; width: 100%;
    display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; text-align: left;
    padding: 24px clamp(26px, 8vw, 112px) 40px;
}

.title {
    margin: 0 0 2.6rem;
    font-weight: 400;
    font-size: clamp(2.4rem, 5vw, 3.3rem);
    letter-spacing: .05em; line-height: 1.4;
}

.lines {
    display: flex; flex-direction: column; gap: 1.6rem;
    width: 100%; min-width: 0; max-width: 46em;
}
.quote-text {
    margin: 0;
    font-size: clamp(1.4rem, 2.2vw, 1.75rem);
    line-height: 1.75; letter-spacing: .02em;
    color: var(--ink);
    overflow-wrap: anywhere;
}
.quote-by {
    margin: .5rem 0 0;
    font-size: .95rem; letter-spacing: .14em;
    color: var(--ink-soft);
    text-align: right;
}

.foot {
    display: flex; align-items: center; gap: 2.4rem;
    margin-top: 3rem;
}
.enter {
    color: var(--accent); text-decoration: none;
    font-size: 1.1rem; letter-spacing: .06em;
    border-bottom: 1px solid var(--line); padding-bottom: .3em;
    transition: opacity .4s ease;
}
.enter .arrow { display: inline-block; transition: transform .4s ease; }
.enter:hover { opacity: .72; }
.enter:hover .arrow { transform: translateX(5px); }
.enter:focus-visible, .swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.swap {
    border: 0; background: none; padding: .4em 0;
    color: var(--ink-soft); font-family: inherit;
    font-size: .92rem; letter-spacing: .12em;
    cursor: pointer; opacity: .62;
    transition: opacity .4s ease;
}
.swap:hover { opacity: 1; }

/* 只做「淡入 + 轻轻抬起」，节奏放慢，不抢眼 */
.reveal {
    opacity: 0;
    animation: rise var(--rise) cubic-bezier(.22, .61, .36, 1) both;
    animation-delay: calc(.35s + var(--i, 0) * var(--stagger));
}
/* 动画结束后的稳定终态，避免任何环境下文字不出现 */
.reveal.settled { opacity: 1; transform: none; animation: none; }
@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    .masthead { padding: 22px 26px; font-size: .85rem; }
    .room { padding: 18px 26px 32px; }
    .title { font-size: 2.2rem; margin-bottom: 2rem; }
    .lines { gap: 1.25rem; }
    .quote-text { font-size: 1.35rem; line-height: 1.7; }
    .quote-by { font-size: .88rem; }
    .foot { margin-top: 2.4rem; gap: 1.8rem; }
    .enter { font-size: 1rem; }
    .swap { font-size: .85rem; }
}

@media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    .enter, .enter .arrow, .swap { transition: none; }
}
</style>
</head>

<body>
<header class="masthead">{{ site.title }}</header>

{% assign show_n = page.show_count | default: 4 %}
{% assign enter_i = show_n | plus: 1 %}
{% assign swap_i = show_n | plus: 2 %}

<main class="room">
    <h1 class="title reveal" style="--i:0">{{ page.headline | default: '先坐一会儿吧' }}</h1>
    <div class="lines" id="lines"></div>
    <!-- 没开 JS 时，把句子老老实实全列出来 -->
    <noscript>
        <div class="lines">
            {% for item in page.words %}
            <div class="quote">
                <p class="quote-text">{{ item.text }}</p>
                <p class="quote-by">{{ item.author | default: '佚名' }}</p>
            </div>
            {% endfor %}
        </div>
    </noscript>

    <footer class="foot">
        <a class="enter reveal" style="--i:{{ enter_i }}"
           href="{{ site.baseurl }}{{ page.enter_url | default: '/home/' }}">
            {{ page.enter_label | default: '进去看看' }}<span class="arrow" aria-hidden="true"> →</span>
        </a>
        <button class="swap reveal" style="--i:{{ swap_i }}" type="button">{{ page.swap_label | default: '换几句' }}</button>
    </footer>
</main>

<!-- 句子池：维护在 index.html 的 words: 列表里（text 正文 / author 作者） -->
<template id="warm-words">
    {% for item in page.words %}<span data-text="{{ item.text | escape }}" data-author="{{ item.author | default: '佚名' | escape }}"></span>{% endfor %}
</template>

<script>
(function () {
    var box = document.getElementById('lines');
    var tpl = document.getElementById('warm-words');
    var swap = document.querySelector('.swap');
    var showCount = {{ page.show_count | default: 4 }};
    var words = [];
    var timer;

    if (tpl && tpl.content) {
        var nodes = tpl.content.querySelectorAll('[data-text]');
        for (var k = 0; k < nodes.length; k++) {
            words.push({
                text: nodes[k].getAttribute('data-text'),
                author: nodes[k].getAttribute('data-author') || ''
            });
        }
    }

    function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }

    function settleAll() {
        var all = document.querySelectorAll('.reveal');
        for (var i = 0; i < all.length; i++) all[i].classList.add('settled');
    }

    function draw() {
        if (!box || !words.length) return;
        clearTimeout(timer);
        box.textContent = '';
        var picked = shuffle(words.slice()).slice(0, Math.min(showCount, words.length));
        picked.forEach(function (item, i) {
            var block = document.createElement('div');
            block.className = 'quote reveal';
            block.style.setProperty('--i', String(i + 1));

            var text = document.createElement('p');
            text.className = 'quote-text';
            text.textContent = item.text;
            block.appendChild(text);

            if (item.author) {
                var by = document.createElement('p');
                by.className = 'quote-by';
                by.textContent = item.author;
                block.appendChild(by);
            }

            block.addEventListener('animationend', function () { block.classList.add('settled'); });
            box.appendChild(block);
        });
        timer = setTimeout(settleAll, (picked.length + 5) * 700 + 1600);
    }

    // 标题、链接、按钮这些固定元素的终态兜底
    var fixed = document.querySelectorAll('.title.reveal, .enter.reveal, .swap.reveal');
    for (var i = 0; i < fixed.length; i++) {
        fixed[i].addEventListener('animationend', function () { this.classList.add('settled'); });
    }

    draw();
    if (swap) swap.addEventListener('click', draw);
})();
</script>
</body>
</html>
